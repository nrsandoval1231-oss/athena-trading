[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-desk"
version = "1.0.0"
description = "Phase 0 walk-forward / paper scaffold for the Astra Desk trading contract."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Astra Desk" }]
dependencies = [
    "PyYAML>=6.0.1",
    "jsonschema>=4.21.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
astra-desk = "astra_desk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astra_desk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
